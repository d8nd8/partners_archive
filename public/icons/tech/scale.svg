<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- platform top surface -->
  <rect x="4" y="10" width="24" height="3" rx="1.5" fill="#1C1C1E"/>
  <!-- display screen -->
  <rect x="8" y="4" width="16" height="9" rx="2" fill="#1C1C1E"/>
  <rect x="9.5" y="5.5" width="13" height="6" rx="1" fill="#052e16"/>
  <!-- weight digits -->
  <rect x="11" y="7" width="3" height="3" rx="0.5" fill="#22C55E" opacity="0.9"/>
  <rect x="15" y="7" width="3" height="3" rx="0.5" fill="#22C55E" opacity="0.9"/>
  <rect x="19" y="7" width="1.5" height="3" rx="0.5" fill="#22C55E" opacity="0.5"/>
  <!-- base pillar -->
  <rect x="13" y="13" width="6" height="3" rx="1" fill="#2C2C2E"/>
  <!-- base foot -->
  <rect x="6" y="16" width="20" height="3.5" rx="1.5" fill="#2C2C2E"/>
  <!-- rubber feet -->
  <rect x="7" y="19.5" width="3" height="1.5" rx="0.75" fill="#111"/>
  <rect x="22" y="19.5" width="3" height="1.5" rx="0.75" fill="#111"/>
  <!-- unit label -->
  <rect x="21" y="8" width="4" height="1.5" rx="0.5" fill="#4ade80" opacity="0.4"/>
</svg>
